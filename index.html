<!doctype html>
<html lang="en">
  <head>

    <title>Gesture-Driven 3D Particle Morph Lab</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <video id="webcam" autoplay playsinline muted></video>

      <div class="legend">
        <span>Templates: heart, flower, saturn, firework + 15 more</span>
      </div>
    </div>

    <script type="module" src="app.js"></script>
